spring.application.name=goose-mail-agent

# Mailgun configuration
mailgun.api-key=${MAILGUN_API_KEY}
mailgun.domain=mail.corby.page
mailgun.signing-key=${MAILGUN_SIGNING_KEY}
mailgun.from=goose-agent@mail.corby.page

# Tomcat multipart limits – Mailgun webhooks send many form parts
# (sender, subject, body-plain, body-html, headers, signature fields,
# attachments, etc.) which can exceed Tomcat's default part count.
server.tomcat.max-part-count=-1
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
